<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婚礼邀请</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h2>JS</h2>
                </div>
                <button class="menu-toggle" aria-label="菜单">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>
        <!-- 移动端菜单 -->
        <div class="mobile-menu">
            <div class="mobile-menu-content">
                <button class="menu-close" aria-label="关闭菜单">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <nav>
                    <ul>
                        <li><a href="#about">关于我们</a></li>
                        <li><a href="#time-place">时间地点</a></li>
                        <li><a href="#rsvp">RSVP</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- 英雄横幅 -->
    <section class="hero">
        <div class="hero-image">
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=elegant%20wedding%20portrait%20of%20couple%20in%20fine%20art%20style%2C%20soft%20lighting%2C%20black%20and%20white&image_size=landscape_16_9" alt="新人肖像" class="hero-img">
        </div>
        <div class="hero-content">
            <h1>彩彩 & 洪超</h1>
            <p class="hero-sub">我们诚挚邀请您见证爱情</p>
        </div>
    </section>

    <!-- 关于我们 -->
    <section id="about" class="about">
        <div class="container">
            <div class="about-content">
                <div class="about-person">
                    <div class="person-image">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=elegant%20portrait%20of%20young%20woman%20in%20fine%20art%20style%2C%20soft%20lighting&image_size=square" alt="佳宁">
                    </div>
                    <h3 class="person-title">她</h3>
                    <p class="person-text">蔡彩猜，毕业于东北大学计算机系，现从事艺术策展工作。热爱旅行、阅读和摄影，有着独特的艺术视角和审美品味。</p>
                </div>
                <div class="about-person">
                    <div class="person-image">
                        <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=elegant%20portrait%20of%20young%20man%20in%20fine%20art%20style%2C%20soft%20lighting&image_size=square" alt="少华">
                    </div>
                    <h3 class="person-title">他</h3>
                    <p class="person-text">刘洪超，毕业于西南交通大学机械系，现从事建筑设计工作。喜欢音乐、登山和美食，注重细节，追求完美。</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 时间地点 -->
    <section id="time-place" class="time-place">
        <div class="container">
            <div class="time-place-content">
                <hr class="divider">
                <div class="date">06.18.2026</div>
                <div class="venue">
                    <h3>婚礼场地</h3>
                    <p>北京市朝阳区建国路88号</p>
                    <p>国贸大酒店 大宴会厅</p>
                </div>
                <div class="map">
                    <svg width="100%" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="100" y1="100" x2="700" y2="100" stroke="#E7E7E7" stroke-width="1"/>
                        <circle cx="100" cy="100" r="8" fill="#0C0C0C"/>
                        <circle cx="700" cy="100" r="8" fill="#0C0C0C"/>
                        <text x="100" y="70" text-anchor="middle" font-family="Libre Franklin" font-size="14">出发点</text>
                        <text x="700" y="70" text-anchor="middle" font-family="Libre Franklin" font-size="14">婚礼场地</text>
                    </svg>
                </div>
                <hr class="divider">
            </div>
        </div>
    </section>

    <!-- RSVP -->
    <section id="rsvp" class="rsvp">
        <div class="container">
            <button class="rsvp-button">RSVP</button>
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="social-links">
                    <a href="#">Instagram</a>
                    <span>|</span>
                    <a href="#">Weibo</a>
                    <span>|</span>
                    <a href="#">Email</a>
                </div>
                <div class="copyright">
                    <p>&copy; 2025 佳宁 & 少华. 保留所有权利.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
